services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oss_pulse}
      POSTGRES_USER: ${POSTGRES_USER:-oss_pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oss_pulse_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oss_pulse} -d ${POSTGRES_DB:-oss_pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
