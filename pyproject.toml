[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oss-pulse"
version = "0.1.0a0"
description = "Open source maintenance intelligence for GitHub repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "OSS Pulse contributors" }]
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pg8000>=1.31,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=6.0,<7.0", "ruff>=0.8,<1.0"]

[project.scripts]
oss-pulse = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
