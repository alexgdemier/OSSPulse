name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit Python runtime dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oss_pulse
          POSTGRES_USER: oss_pulse
          POSTGRES_PASSWORD: oss_pulse_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oss_pulse -d oss_pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+pg8000://oss_pulse:oss_pulse_local@localhost:5432/oss_pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check backend
      - run: ruff format --check backend
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: pytest
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --env-file .env.production.example -f docker-compose.release.yml config --quiet
      - run: docker compose --env-file .env.production.example -f docker-compose.release.yml up --build --wait
      - run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/
      - if: always()
        run: docker compose --env-file .env.production.example -f docker-compose.release.yml down
  recovery-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify isolated PostgreSQL backup and restore
        shell: pwsh
        run: ./scripts/recovery-drill.ps1
