name: Bug report
description: Report a reproducible OSS Pulse problem
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context (remove secrets from logs)
