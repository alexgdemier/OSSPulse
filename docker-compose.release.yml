name: oss-pulse

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.compose.example to .env.local first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.compose.example to .env.local first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.compose.example to .env.local first}
    volumes:
      - oss_pulse_release_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Copy .env.compose.example to .env.local first}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Copy .env.compose.example to .env.local first}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_MAX_PAGES: ${GITHUB_MAX_PAGES:-3}
      GITHUB_TIMEOUT_SECONDS: ${GITHUB_TIMEOUT_SECONDS:-15}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/v1/ready', timeout=3)
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OSSPULSE_API_URL: http://api:8002/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000").then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  oss_pulse_release_data:
